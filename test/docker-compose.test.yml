# Ephemeral Postgres+pgvector + Redis for integration flows.
# Do not bind 5433 — that is the local app DB (see backend/.env).
# Ports 5434/6380 avoid app 5433 and root docker-compose.yml 5432/6379.
# DB name *_test satisfies prodDbGuard.
# Vitest Testcontainers uses random host ports (preferred); this compose is the manual fallback.
#
#   docker compose -f backend/test/docker-compose.test.yml up -d --wait
#   DATABASE_URL=postgresql://convosync:convosync_test@127.0.0.1:5434/convosync_test
#   DIRECT_URL=$DATABASE_URL
#   REDIS_URL=redis://127.0.0.1:6380
#   then prisma db push + the three flows in high-risk.integration.skip.ts
#   docker compose -f backend/test/docker-compose.test.yml down

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: convosync_test
      POSTGRES_USER: convosync
      POSTGRES_PASSWORD: convosync_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convosync -d convosync_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
